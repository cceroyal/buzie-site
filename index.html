<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUZIE — скоро</title>
  <meta name="description" content="BUZIE — газировка без калорий. Сайт скоро откроется.">
  <meta name="theme-color" content="#FBF9AC">
  <link rel="icon" type="image/png" href="assets/logo-orange.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #FBF9AC; --orange: #FF4000; --ink: #2a0d05; }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: var(--cream); color: var(--ink);
      font-family: "Onest", system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px; text-align: center;
    }
    main { display: flex; flex-direction: column; align-items: center; }
    img { width: min(420px, 82vw); height: auto; display: block; }
    .slogan {
      margin-top: 28px; color: var(--orange);
      font-family: "Unbounded", system-ui, sans-serif; font-weight: 800;
      font-size: clamp(16px, 3.4vw, 22px); letter-spacing: .08em;
    }
    p { margin-top: 18px; font-size: clamp(17px, 3.6vw, 20px); }
    a { color: var(--orange); font-weight: 500; }
    footer { margin-top: 48px; font-size: 12px; opacity: .6; max-width: 520px; }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo-orange.png" alt="BUZIE" width="942" height="293">
    <div class="slogan">НА ВОЛНЕ БАЛАНСА</div>
    <p>Сайт скоро откроется.<br>Пишите нам: <a href="mailto:drinkbuzie@gmail.com">drinkbuzie@gmail.com</a></p>
  </main>
</body>
</html>
