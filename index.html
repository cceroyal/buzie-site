<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>БУЗИ — скоро открытие</title>
  <meta name="description" content="БУЗИ — сайт скоро откроется.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <style>
    :root {
      --bg: #faf7f2;
      --text: #1d1b18;
      --muted: #6f6a62;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151412; --text: #f3efe8; --muted: #a39d93; --accent: #fb923c; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 560px; }
    h1 {
      font-size: clamp(56px, 16vw, 120px);
      letter-spacing: 0.06em;
      font-weight: 800;
      line-height: 1;
    }
    .line {
      width: 64px; height: 4px; border-radius: 2px;
      background: var(--accent);
      margin: 28px auto;
    }
    p { font-size: clamp(18px, 4.5vw, 22px); color: var(--muted); line-height: 1.5; }
    footer { position: fixed; bottom: 16px; left: 0; right: 0; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>БУЗИ</h1>
    <div class="line"></div>
    <p>Сайт скоро откроется.<br>Мы готовим кое-что интересное.</p>
  </main>
  <footer>© 2026 БУЗИ · buzie.ru</footer>
</body>
</html>
